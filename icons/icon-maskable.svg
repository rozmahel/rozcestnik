<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3ED6B8"/>
    <stop offset="1" stop-color="#0E8C7C"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.6" stop-color="#F3F7F6"/>
    <stop offset="1" stop-color="#D5E2DF"/>
  </linearGradient>
  <radialGradient id="glass" cx="0.38" cy="0.34" r="0.75">
    <stop offset="0" stop-color="#F4FFFC"/>
    <stop offset="0.65" stop-color="#CDEFE7"/>
    <stop offset="1" stop-color="#A9DDD2"/>
  </radialGradient>
  <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2A8577"/>
    <stop offset="1" stop-color="#145449"/>
  </linearGradient>
  <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#CFDDDA"/>
  </linearGradient>
  <filter id="objShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
    <feOffset dx="0" dy="18" result="b"/>
    <feFlood flood-color="#064A40" flood-opacity="0.38"/>
    <feComposite in2="b" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bodyShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
    <feOffset dx="0" dy="10" result="b"/>
    <feFlood flood-color="#000000" flood-opacity="0.28"/>
    <feComposite in2="b" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  
  <g transform="translate(512 512) scale(0.9) translate(-512 -512)" filter="url(#objShadow)">
    <g transform="rotate(45 440 440)">
      <rect x="632" y="404" width="80" height="72" rx="14" fill="url(#collar)"/>
      <rect x="696" y="390" width="190" height="100" rx="50" fill="url(#grip)"/>
      <rect x="716" y="402" width="150" height="16" rx="8" fill="#FFFFFF" opacity="0.18"/>
    </g>
    <circle cx="440" cy="440" r="218" fill="url(#rim)"/>
    <circle cx="440" cy="440" r="170" fill="#9CC9BF" opacity="0.55"/>
    <circle cx="440" cy="440" r="164" fill="url(#glass)"/>
    <path d="M 322.0 410.0 A 122 122 0 0 1 410.0 322.0"
          fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.9"/>
    <circle cx="312" cy="448" r="11" fill="#FFFFFF" opacity="0.85"/>
  </g>

</svg>
